[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slice-ephys-analysis"
version = "0.1.0"
description = "Offline analysis for slice-ephys-mapping: PPSF surfaces, PSC quantification, ensemble->target weight regression, E/I coupling."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "h5py",
    "scikit-learn",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
